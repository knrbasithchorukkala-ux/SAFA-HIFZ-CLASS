*{

margin:0;
padding:0

:root{

--primary2:#10b981;
--bg:#e9f5ef;
--card:#fdfefe;
--text:#12382d;

html{

body{

button,

select,
textarea{

}

button{

}

/* LOADING */

#loading{
position:fixed;
inset:0;
z-index:99999;

display:flex;
align-items:center;
justify-content:center;

color:#fff;

font-weight:900;
letter-spacing:.5px;

background:
radial-gradient(circle at center,rgba(212,175,55,.15),transparent 30%),
linear-gradient(135deg,#021f1a,#06483a,#087f5b)
}

#loading:before{
content:"";
position:absolute;
width:180px;
height:180px;
border:2px solid rgba(244,215,120,.18);
transform:rotate(45deg);
border-radius:28px
}

#loading:after{
content:"";
position:absolute;
width:110px;
height:110px;
border:1px solid rgba(244,215,120,.14);

transform:rotate(45deg);
border-radius:18px
}

/* MESSAGE */

#message{
position:fixed;
right:20px;
bottom:20px;
max-width:390px;
padding:15px 19px;
border-radius:14px;
color:#fff;
display:none;
z-index:99999;
box-shadow:0 15px 35px rgba(0,0,0,.22);
font-size:14px;
font-weight:800
}

/* APP */

.app{
min-height:100vh;
display:flex
}

/* SIDEBAR */

.sidebar{
width:270px;
position:fixed;
left:0;
top:0;
bottom:0;
z-index:1000;
overflow-y:auto;
color:#fff;

background:
radial-gradient(circle at 50% 12%,rgba(212,175,55,.15),transparent 25%),
radial-gradient(circle at 20% 85%,rgba(16,185,129,.10),transparent 28%),
linear-gradient(180deg,#032b24 0%,#06483a 48%,#02251e 100%);

border-right:1px solid rgba(212,175,55,.42);
box-shadow:7px 0 30px rgba(3,43,36,.20)
}

.sidebar:before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
opacity:.055;

background:
linear-gradient(30deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%),
linear-gradient(150deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%);

background-size:40px 70px
}

.sidebar:after{
content:"";
position:absolute;
left:50%;
top:110px;
width:150px;
height:150px;
transform:translateX(-50%) rotate(45deg);
border:1px solid rgba(212,175,55,.08);
pointer-events:none
}

.brand{
position:relative;
z-index:1;
padding:25px 19px 23px;
border-bottom:1px solid rgba(212,175,55,.28)
}

.brand-top{
display:flex;
align-items:center;
gap:12px
}

.logo-box{
width:48px;
height:48px;
flex-shrink:0;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;

font-size:23px;
font-weight:900;
color:#173b2d;

background:linear-gradient(135deg,#d4af37,#f5da78);

box-shadow:0 7px 22px rgba(212,175,55,.28)
}

.logo-box:after{
content:"✦";
font-size:25px
}

.logo-box{
font-size:0
}

.brand h1{
font-size:17px;
font-weight:900
}

.brand p{
margin-top:5px;
color:#f1d77d;
font-size:10px;
font-weight:900;
letter-spacing:1.8px
}

.menu{
position:relative;
z-index:1;
padding:17px 11px 25px
}

.menu-label{
padding:12px 14px 8px;
color:#d4af37;
font-size:9px;
font-weight:900;
letter-spacing:1.8px;
text-transform:uppercase
}

.menu button{
width:100%;

border:0;
background:transparent;
color:#d9eee5;
text-align:left;
padding:12px 14px;
margin-bottom:4px;
border-radius:11px;
font-size:13px;
font-weight:700;
transition:.2s
}

.menu button:hover{
color:#fff;
background:rgba(212,175,55,.13);
transform:translateX(2px)
}

.menu button.active{
color:#183b2e;
font-weight:900;
background:linear-gradient(135deg,#d4af37,#f2d46d);
box-shadow:0 7px 22px rgba(212,175,55,.23)
}

.menu button span{
display:inline-flex;
width:31px;
height:28px;
align-items:center;
justify-content:center;
margin-right:2px;
font-size:16px
}

/* MAIN */

.main{
margin-left:270px;
width:calc(100% - 270px);
min-height:100vh
}

/* TOPBAR */

.topbar{
height:76px;
position:sticky;

top:0;
z-index:500;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;

background:rgba(248,253,250,.95);
border-bottom:2px solid rgba(212,175,55,.25);
backdrop-filter:blur(14px);
box-shadow:0 5px 20px rgba(3,43,36,.07)
}

.top-left{
display:flex;
align-items:center;
gap:14px
}

.top-title{
color:#063b2b;
font-size:20px;
font-weight:900
}

.top-subtitle{
margin-top:3px;
color:var(--muted);
font-size:11px
}

.top-right{
display:flex;
align-items:center;
gap:10px
}

.admin-badge{
padding:8px 14px;
border-radius:20px;
color:#087f5b;
background:#e1f5e9;
border:1px solid #acd7bd;
font-size:10px;
font-weight:900
}

.logout{

border:1px solid #efc5c0;
padding:9px 14px;
border-radius:9px;
color:#a32016;
background:#fff0ee;
font-weight:900
}

.logout:hover{
background:#ffe4e0
}

.mobile-menu{
display:none;
border:0;
padding:8px 11px;
border-radius:9px;
color:#fff;
background:#063b2b;
font-size:20px
}

/* CONTENT */

.content{
position:relative;
padding:30px;
min-height:calc(100vh - 76px);
overflow:hidden
}

.content:before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
opacity:.035;

background:
linear-gradient(30deg,#087f5b 12%,transparent 12.5%,transparent 87%,#087f5b 87.5%),
linear-gradient(150deg,#087f5b 12%,transparent 12.5%,transparent 87%,#087f5b 87.5%);

background-size:42px 72px
}

.content:after{
content:"";
position:absolute;

width:360px;
height:360px;
right:-180px;
bottom:-180px;
border:1px solid rgba(212,175,55,.10);
transform:rotate(45deg);
pointer-events:none
}

.content>*{
position:relative;
z-index:1
}

/* SECTIONS */

.section{
display:none
}

.section.active{
display:block;
animation:fadeIn .25s ease
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(5px)
}
to{
opacity:1;
transform:translateY(0)
}
}

.section-head{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:15px;
margin-bottom:22px
}

.section-head h2{
color:#164c39;
font-size:26px;
font-weight:900;

margin-bottom:5px
}

.section-head p{
color:var(--muted);
font-size:13px
}

.section-tag{
padding:7px 13px;
border-radius:20px;
color:#087f5b;
background:#dff3e7;
border:1px solid #b9ddc8;
font-size:10px;
font-weight:900
}

/* COLLEGE HERO */

.college-header{
position:relative;
overflow:hidden;
min-height:330px;
margin-bottom:25px;
border-radius:25px;
border:2px solid rgba(212,175,55,.65);

background:linear-gradient(135deg,#032b24,#087f5b);

box-shadow:0 18px 45px rgba(3,43,36,.23)
}

.college-header:before{
content:"";
position:absolute;
width:280px;
height:280px;
left:-150px;
top:-150px;
border:1px solid rgba(244,215,120,.16);
transform:rotate(45deg);
z-index:2;
pointer-events:none
}

.college-header:after{
content:"";

position:absolute;
width:210px;
height:210px;
right:-120px;
bottom:-120px;
border:1px solid rgba(244,215,120,.13);
transform:rotate(45deg);
z-index:2;
pointer-events:none
}

.college-header img{
width:100%;
height:330px;
display:block;
object-fit:cover;
object-position:center;
filter:saturate(1.08) contrast(1.03)
}

.college-header-overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:25px;

background:
linear-gradient(
180deg,
rgba(3,43,36,.18),
rgba(3,43,36,.40) 35%,
rgba(3,43,36,.94) 100%
)
}

.college-header-overlay:before{
content:"";
position:absolute;
inset:12px;
border:1px solid rgba(244,215,120,.20);
border-radius:18px;
pointer-events:none
}

.college-title{
position:relative;
color:#fff;
font-size:31px;
font-weight:900;
letter-spacing:1px;
text-shadow:0 4px 16px rgba(0,0,0,.55)
}

.college-subtitle{
position:relative;
margin-top:7px;
color:#f4d778;
font-size:13px;
font-weight:900;
letter-spacing:3px
}

.college-header-line{
position:relative;
width:150px;
height:3px;
margin-top:14px;
border-radius:10px;

background:
linear-gradient(
90deg,
transparent,
#d4af37,
#fff1a8,
#d4af37,
transparent
);

box-shadow:0 0 15px rgba(212,175,55,.4)
}

.college-ayah{
position:relative;
margin-top:18px;
color:#f7dc83;
direction:rtl;

font-family:
"Amiri",
"Traditional Arabic",
serif;

font-size:29px;
font-weight:bold;
line-height:1.8;
text-shadow:0 4px 14px rgba(0,0,0,.60)
}

.college-ayah-meaning{
position:relative;
margin-top:5px;
color:#fff;
font-size:12px;
opacity:.94
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:25px
}

.stat{
position:relative;
overflow:hidden;
padding:20px;
border-radius:17px;
color:#fff;
border:1px solid rgba(212,175,55,.35);
box-shadow:var(--shadow);
transition:.25s
}

.stat:nth-child(1){
background:linear-gradient(135deg,#07583f,#0a9670)
}

.stat:nth-child(2){
background:linear-gradient(135deg,#06483a,#087f5b)
}

.stat:nth-child(3){
background:linear-gradient(135deg,#176247,#0b8b68)
}

.stat:nth-child(4){

background:linear-gradient(135deg,#07503c,#08765a)
}

.stat:after{
content:"";
position:absolute;
width:100px;
height:100px;
right:-35px;
top:-35px;
border:1px solid rgba(255,255,255,.13);
transform:rotate(45deg);
border-radius:18px
}

.stat:hover{
transform:translateY(-4px);
border-color:#f4d778;
box-shadow:0 16px 35px rgba(3,43,36,.2)
}

.stat-icon{
width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:14px;
border-radius:13px;
color:#174331;
background:linear-gradient(135deg,#f1d36a,#fff0a6);
font-size:20px
}

.stat small{
color:#dff4e9;
font-size:11px;
font-weight:800
}

.stat strong{
display:block;
margin-top:6px;
color:#fff;
font-size:30px;
font-weight:900
}

/* PANELS */

.panel{
padding:23px;
margin-bottom:22px;
border-radius:17px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.98),
rgba(239,249,244,.98)
);

border:1px solid var(--border);
box-shadow:var(--shadow);
transition:.2s
}

.panel:hover{
box-shadow:0 15px 35px rgba(3,43,36,.13)
}

.panel-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:18px;
padding-bottom:13px;
border-bottom:2px solid rgba(212,175,55,.20)
}

.panel h3{
color:#164c39;
font-size:17px;
font-weight:900
}

.panel-desc{
margin-top:3px;
color:var(--muted);
font-size:11px
}

/* QUICK ACCESS */

.quick{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.quick button{
position:relative;
overflow:hidden;
padding:19px;
text-align:left;
border:1px solid #c7e1d3;
border-radius:14px;
color:var(--text);

background:
linear-gradient(
135deg,
#f5fcf8,
#e4f4eb
);

transition:.25s
}

.quick button:before{
content:"";
position:absolute;
width:65px;
height:65px;
right:-20px;
top:-20px;
border:1px solid rgba(8,127,91,.12);
transform:rotate(45deg);
border-radius:12px
}

.quick button:hover{
transform:translateY(-4px);
border-color:rgba(212,175,55,.8);
box-shadow:0 12px 25px rgba(3,43,36,.13);

background:
linear-gradient(
135deg,
#fffdf3,
#e1f5ea
)
}

.quick-icon{
margin-bottom:12px;
color:#087f5b;
font-size:23px
}

.quick strong{
display:block;
margin-bottom:5px;
color:#173e30
}

.quick small{
color:var(--muted)
}

/* FORMS */

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px
}

.field{
display:flex;
flex-direction:column;
gap:7px
}

.field.full{
grid-column:1/-1
}

.field label{
color:#315b49;
font-size:12px;
font-weight:900
}

.field input,
.field select,
.field textarea{
width:100%;
padding:11px 12px;
outline:none;
color:var(--text);

background:#f5fbf7;
border:1px solid #c4dfcf;
border-radius:10px;
transition:.2s
}

.field textarea{
min-height:100px;
resize:vertical
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#0a956a;
background:#fff;
box-shadow:0 0 0 3px rgba(10,149,106,.11)
}

/* STUDY SPECIAL FORM */

.study-info{
grid-column:1/-1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:3px
}

.study-info-card{
padding:13px;
border-radius:12px;

background:
linear-gradient(
135deg,
#e5f5eb,
#fff8df
);

border:1px solid rgba(212,175,55,.35)
}

.study-info-card strong{
display:block;
color:#164c39;
font-size:12px;
font-weight:900

}

.study-info-card span{
display:block;
margin-top:4px;
color:var(--muted);
font-size:10px
}

.primary{
border:0;
padding:11px 18px;
border-radius:10px;
color:#fff;

background:
linear-gradient(
135deg,
#087f5b,
#0aad78
);

font-weight:900;
box-shadow:0 5px 15px rgba(8,127,91,.18);
transition:.2s
}

.primary:hover{
background:
linear-gradient(
135deg,
#076b4d,
#098f68

transform:translateY(-1px)
}

.secondary{
padding:10px 15px;
border:1px solid #c5dfcf;
border-radius:9px;
color:#315b49;
background:#eef8f2;
font-weight:800
}

.secondary:hover{
background:#dff1e7
}

.danger,
.success,
.warning{
padding:8px 11px;
border:0;
border-radius:8px;
font-weight:900
}

.danger{
color:#b42318;
background:#fdebea
}

.success{
color:#087f5b;
background:#dff3e7
}

.warning{
color:#916300;
background:#fff1ca
}

.danger:hover{
background:#f9d8d4
}

.success:hover{
background:#cdebd9
}

.warning:hover{
background:#ffe9ae
}

async function loadAttendance(){
try{
const snap=await getDocs(collection(db,"attendance"));

const table=$("attendanceTable");

if(!rows.length){
table.innerHTML=`<div class="empty">No Absent / Leave attendance records.</div>`;
return;
}

const grouped={};
rows.forEach(row=>{const date=String(row.date||"-");if(!grouped[date])grouped[date]=[];grouped[date].push(row);});
const dates=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));

table.innerHTML=dates.map(date=>{
const dateRows=grouped[date];
return `<div class="table-wrap" style="margin-bottom:18px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;background:linear-gradient(135deg,#dff2e7,#fff8df);border-bottom:1px solid #d2e6da"><strong style="color:#164c39">Date: ${escapeHtml(date)}</strong><span class="badge badge-red">Absent / Leave: ${dateRows.length}</span></div><table><thead><tr><th>No</th><th>Name</th><th>Status</th><th>Action</th></tr></thead><tbody>${dateRows.map(row=>`<tr><td><strong>${escapeHtml(row.studentNumber||"-")}</strong></td><td>${escapeHtml(studentNameByNumber(row.studentNumber))}</td><td><span class="badge ${row.status==="leave"?"badge-yellow":"badge-red"}">${escapeHtml(row.status)}</span></td><td><div class="actions"><button class="secondary attendance-edit-btn" data-id="${row.id}" data-status="${escapeHtml(row.status)}">Edit</button><button class="danger attendance-delete-btn" data-id="${row.id}">Delete</button></div></td></tr>`).join("")}</tbody></table></div>`;
}).join("");

button.addEventListener("click",async()=>{
const current=button.dataset.status==="leave"?"leave":"absent";

const newStatus=value.trim().toLowerCase();

await updateDoc(doc(db,"attendance",button.dataset.id),{status:newStatus});
showMessage("Attendance updated.");

});
});

}catch(error){
console.error(error);

/* DONATIONS */

async function loadDonations(){

try{

const snap=
await getDocs(
collection(
db,
"donations"
)
);

const rows=
snap.docs.map(
item=>({

id:item.id,

...item.data()

})
);

rows.sort(
(a,b)=>

(b.createdAt?.seconds||0)
-
(a.createdAt?.seconds||0)
);

let total=0;

let pending=0;

let verified=0;

rows.forEach(
row=>{

const amount=
Number(
row.amount||0
);

total+=amount;

if(
row.status==="pending"
)
pending+=amount;

if(
row.status==="verified"
)
verified+=amount;

}
);

$("donationTotal")
.textContent=
money(total);

$("donationPending")
.textContent=
money(pending);

$("donationVerified")
.textContent=
money(verified);

const table=
$("donationsTable");

if(!rows.length){

table.innerHTML=
`
<tr>

<td colspan="8">

<div class="empty">
No donations found.
</div>

</td>

</tr>
`;

return;

}

table.innerHTML=
rows.map(
row=>`

<tr>

<td>

<strong>
${escapeHtml(
studentNameByNumber(
row.studentNumber
)
)}
</strong>

<br>

<small>
${escapeHtml(
row.studentNumber||"-"
)}
</small>

</td>

<td>
${escapeHtml(
row.parentEmail||"-"
)}
</td>

<td>

<strong>
${money(row.amount)}
</strong>

</td>

<td>
${escapeHtml(
row.transactionId||"-"
)}
</td>

<td>
${formatDate(
row.createdAt
)}
</td>

<td>

<span class="badge ${
row.status==="verified"
?
"badge-green"
:
row.status==="rejected"
?
"badge-red"
:
"badge-yellow"
}">

${escapeHtml(
row.status||"pending"
)}

</span>

</td>

<td>
${escapeHtml(
row.adminNote||"-"
)}
</td>

<td>

<div class="actions">

${
row.status!=="verified"
?
`
<button
class="success donation-verify"
data-id="${row.id}">
Verify
</button>
`
:
""
}

${
row.status!=="rejected"
?
`
<button
class="warning donation-reject"
data-id="${row.id}">
Reject
</button>
`
:
""
}

<button
class="danger donation-delete"
data-id="${row.id}">
Delete
</button>

</div>

</td>

</tr>

`
)
.join("");
