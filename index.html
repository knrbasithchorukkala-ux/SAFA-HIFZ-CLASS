<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFA HIFZ CLASS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .login-box {
      max-width: 420px;
      margin: 45px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #064e47;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d00;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>SAFA HIFZ CLASS</h1>
    <p>Student & Parent Management System</p>
  </div>

  <div class="login-box">
    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">Login</button>

    <div id="message"></div>
  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCR-A17PO3zeiY2a1eH9cvxSmv4Upxqe4",
      authDomain: "safa-hifz-class-7e84b.firebaseapp.com",
      projectId: "safa-hifz-class-7e84b",
      storageBucket: "safa-hifz-class-7e84b.firebasestorage.app",
      messagingSenderId: "476801753196",
      appId: "1:476801753196:web:b7f86a1f02eabec706f849",
      measurementId: "G-MR45L2B8PL"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // Login Function
    window.login = async function () {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      const loginButton =
        document.getElementById("loginButton");


      // Check empty fields
      if (!email || !password) {
        message.style.color = "red";
        message.textContent =
          "Email and password നൽകുക.";
        return;
      }


      // Disable button
      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        // IMPORTANT:
        // Keep login session in browser
        await setPersistence(
          auth,
          browserLocalPersistence
        );


        // Sign in
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.style.color = "green";
        message.textContent =
          "Login successful!";


        // Go to dashboard
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);


      } catch (error) {

        console.log("Firebase Login Error:", error);

        message.style.color = "red";

        if (error.code === "auth/invalid-credential") {
          message.textContent =
            "Email അല്ലെങ്കിൽ password തെറ്റാണ്.";
        }
        else if (error.code === "auth/invalid-email") {
          message.textContent =
            "ശരിയായ email നൽകുക.";
        }
        else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "കൂടുതൽ login ശ്രമങ്ങൾ ഉണ്ടായിട്ടുണ്ട്. കുറച്ച് സമയം കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.";
        }
        else {
          message.textContent =
            "Login failed. വീണ്ടും ശ്രമിക്കുക.";
        }


        // Enable button
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    };

  </script>

</body>
</html>
