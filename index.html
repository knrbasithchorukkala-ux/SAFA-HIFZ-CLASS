<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFA QURAN COLLEGE ONLINE PORTAL - Login</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f766e">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f766e, #164e63);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      color: #0f766e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>SAFA QURAN COLLEGE ONLINE PORTAL</h1>

  <div class="subtitle">
    Usthad / Parent Login
  </div>

  <form id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
    >

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <div id="message"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC6WpY_AThyG49YPS92rnPG9zy0PYDPVt0",

  authDomain:
    "safa-hifz-class-7e84b.firebaseapp.com",

  projectId:
    "safa-hifz-class-7e84b",

  storageBucket:
    "safa-hifz-class-7e84b.firebasestorage.app",

  messagingSenderId:
    "476801753196",

  appId:
    "1:476801753196:web:d4c8a8b0c1a4203606f849",

  measurementId:
    "G-ZTBTJCB5SR"

};


/* =========================
   FIREBASE INITIALIZE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type = "error"
){

  message.style.display = "block";

  message.className = type;

  message.textContent = text;

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
  "submit",
  async (e) => {

    e.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if(!email || !password){

      showMessage(
        "Email and password required."
      );

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";


    try {

      /* -------------------------
         KEEP LOGIN SESSION
      ------------------------- */

      await setPersistence(
        auth,
        browserLocalPersistence
      );


      /* -------------------------
         FIREBASE LOGIN
      ------------------------- */

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const uid =
        result.user.uid;


      /* -------------------------
         GET USER PROFILE
      ------------------------- */

      const userRef =
        doc(
          db,
          "users",
          uid
        );


      const userSnap =
        await getDoc(userRef);


      if(!userSnap.exists()){

        showMessage(
          "ഈ account-ന് Firestore users profile ഇല്ല."
        );

        await signOut(auth);

        return;

      }


      const userData =
        userSnap.data();


      const role =
        String(
          userData.role || ""
        )
        .trim()
        .toLowerCase();


      /* =========================
         ADMIN LOGIN
      ========================= */

      if(role === "admin"){

        showMessage(
          "Login successful. Admin dashboard തുറക്കുന്നു...",
          "success"
        );


        setTimeout(
          () => {

            window.location.replace(
              "admin.html"
            );

          },
          500
        );


        return;

      }


      /* =========================
         PARENT LOGIN
      ========================= */

      if(role === "parent"){

        showMessage(
          "Login successful. Parent dashboard തുറക്കുന്നു...",
          "success"
        );


        setTimeout(
          () => {

            window.location.replace(
              "parent.html"
            );

          },
          500
        );


        return;

      }


      /* =========================
         INVALID ROLE
      ========================= */

      showMessage(
        "ഈ account-ന് valid role ഇല്ല."
      );


      await signOut(auth);


    } catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      let text =
        error.message ||
        "Login failed.";


      /* -------------------------
         FIREBASE AUTH ERRORS
      ------------------------- */

      if(
        error.code ===
        "auth/invalid-credential"
      ){

        text =
          "Email അല്ലെങ്കിൽ password തെറ്റാണ്.";

      }


      else if(
        error.code ===
        "auth/user-not-found"
      ){

        text =
          "ഈ email ഉപയോഗിച്ച് account കണ്ടെത്തിയില്ല.";

      }


      else if(
        error.code ===
        "auth/wrong-password"
      ){

        text =
          "Password തെറ്റാണ്.";

      }


      else if(
        error.code ===
        "auth/invalid-api-key"
      ){

        text =
          "Firebase API configuration പരിശോധിക്കണം.";

      }


      else if(
        error.code ===
        "auth/network-request-failed"
      ){

        text =
          "Internet connection പരിശോധിക്കുക.";

      }


      else if(
        error.code ===
        "permission-denied"
      ){

        text =
          "Firebase Firestore permission denied.";

      }


      showMessage(text);


    } finally {

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";

    }

  }
);

</script>


<!-- =========================
     PWA SERVICE WORKER
========================= -->

<script>

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(() => {

          console.log(
            "PWA service worker registered"
          );

        })
        .catch((error) => {

          console.error(
            "PWA service worker error:",
            error
          );

        });

    }
  );

}

</script>

</body>
</html>
