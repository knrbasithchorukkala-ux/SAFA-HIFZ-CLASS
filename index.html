<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAFA HIFZ CLASS - Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loginBox{
  width:90%;
  max-width:420px;
  background:white;
  padding:30px 25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

h1{
  text-align:center;
  color:#075e54;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#075e54;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
  min-height:22px;
  line-height:1.5;
}

.success{
  color:#166534;
}

.error{
  color:#b3261e;
}

.loading{
  color:#075e54;
}
</style>

</head>

<body>

<div class="loginBox">

  <h1>SAFA HIFZ CLASS</h1>

  <div class="subtitle">
    Login to continue
  </div>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter email"
      autocomplete="username"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
      required
    >

    <button
      id="loginButton"
      type="submit"
    >
      Login
    </button>

  </form>

  <div id="message"></div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyC6WpY_AThyG49yPS92rnPG9zy0PYDPVt0",

  authDomain:
  "safa-hifz-class-7e84b.firebaseapp.com",

  projectId:
  "safa-hifz-class-7e84b",

  storageBucket:
  "safa-hifz-class-7e84b.firebasestorage.app",

  messagingSenderId:
  "476801753196",

  appId:
  "1:476801753196:web:d4c8a8b0c1a4203606f849",

  measurementId:
  "G-ZTBTJCB5SR"

};


/* =========================
   FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  message.textContent = text;

  message.className = type || "";

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    if(!email || !password){

      showMessage(
        "Email and password നൽകണം.",
        "error"
      );

      return;
    }


    loginButton.disabled = true;

    showMessage(
      "Logging in...",
      "loading"
    );


    try{

      /* Login persistence */

      await setPersistence(
        auth,
        browserLocalPersistence
      );


      /* Firebase Authentication */

      const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      const user =
      credential.user;


      console.log(
        "AUTH UID:",
        user.uid
      );


      showMessage(
        "Login successful ✓ Profile പരിശോധിക്കുന്നു...",
        "success"
      );


      /* =========================
         FIRESTORE USER PROFILE
      ========================= */

      const userRef =
      doc(
        db,
        "users",
        user.uid
      );


      console.log(
        "Checking Firestore document:",
        "users/" + user.uid
      );


      const userSnap =
      await getDoc(userRef);


      /* DOCUMENT NOT FOUND */

      if(!userSnap.exists()){

        console.error(
          "USER DOCUMENT NOT FOUND"
        );

        showMessage(
          "User profile കണ്ടെത്താനായില്ല.",
          "error"
        );

        loginButton.disabled = false;

        return;
      }


      /* =========================
         USER DATA
      ========================= */

      const userData =
      userSnap.data();


      console.log(
        "USER DATA:",
        userData
      );


      const rawRole =
      userData.role;


      const role =
      String(
        rawRole ?? ""
      )
      .trim()
      .toLowerCase();


      console.log(
        "RAW ROLE:",
        rawRole
      );

      console.log(
        "FINAL ROLE:",
        role
      );


      /* =========================
         ADMIN
      ========================= */

      if(role === "admin"){

        showMessage(
          "Admin Dashboard തുറക്കുന്നു...",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
            "dashboard.html";

          },
          500
        );


        return;
      }


      /* =========================
         PARENT
      ========================= */

      if(role === "parent"){

        const studentNumber =
        String(
          userData.studentNumber ?? ""
        ).trim();


        console.log(
          "PARENT STUDENT NUMBER:",
          studentNumber
        );


        if(!studentNumber){

          showMessage(
            "Parent account-ന് student link ഇല്ല.",
            "error"
          );

          loginButton.disabled = false;

          return;
        }


        showMessage(
          "Parent Dashboard തുറക്കുന്നു...",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
            "parent.html";

          },
          500
        );


        return;
      }


      /* =========================
         UNKNOWN ROLE
      ========================= */

      console.error(
        "INVALID ROLE:",
        rawRole
      );


      showMessage(
        "ഈ account-ന് valid role ഇല്ല. Role = [" +
        String(rawRole) +
        "]",
        "error"
      );


      loginButton.disabled = false;


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      let errorMessage =
      "Login ചെയ്യാൻ കഴിഞ്ഞില്ല.";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        errorMessage =
        "Email അല്ലെങ്കിൽ password തെറ്റാണ്.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        errorMessage =
        "Email ശരിയല്ല.";

      }

      else if(
        error.code ===
        "auth/user-not-found"
      ){

        errorMessage =
        "ഈ email-ൽ account കണ്ടെത്താനായില്ല.";

      }

      else if(
        error.code ===
        "auth/wrong-password"
      ){

        errorMessage =
        "Password തെറ്റാണ്.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        errorMessage =
        "വളരെ അധികം ശ്രമങ്ങൾ. കുറച്ച് സമയം കഴിഞ്ഞ് ശ്രമിക്കുക.";

      }

      else if(
        error.code ===
        "auth/network-request-failed"
      ){

        errorMessage =
        "Internet connection പരിശോധിക്കുക.";

      }

      else if(
        error.code ===
        "auth/operation-not-allowed"
      ){

        errorMessage =
        "Email/Password login Firebase-ൽ enable ചെയ്തിട്ടില്ല.";

      }

      else if(
        error.code ===
        "auth/api-key-not-valid"
      ){

        errorMessage =
        "Firebase API key configuration പരിശോധിക്കണം.";

      }

      else{

        errorMessage =
        error.message ||
        errorMessage;

      }


      showMessage(
        errorMessage,
        "error"
      );


      loginButton.disabled = false;

    }

  }
);

</script>

</body>

</html>
