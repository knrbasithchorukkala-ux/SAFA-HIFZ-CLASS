<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFA QURAN COLLEGE ONLINE PORTAL - Login</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f766e">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f766e, #164e63);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      color: #0f766e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>SAFA QURAN COLLEGE ONLINE PORTAL</h1>
  <div class="subtitle">Usthad / Parent Login</div>

  <form id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
    >

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <div id="message"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCR-A17PO3zeiY2a1eH9cvxSmv4Upxqe-4",
  authDomain: "safa-hifz-class-7e84b.firebaseapp.com",
  projectId: "safa-hifz-class-7e84b",
  storageBucket: "safa-hifz-class-7e84b.firebasestorage.app",
  messagingSenderId: "476801753196",
  appId: "1:476801753196:web:b7f86a1f02eabec706f849",
  measurementId: "G-MR45L2B8PL"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


function showMessage(text, type = "error") {
  message.style.display = "block";
  message.className = type;
  message.textContent = text;
}


form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {

    await setPersistence(auth, browserLocalPersistence);

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const uid = result.user.uid;

    const userRef = doc(db, "users", uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {

      showMessage(
        "ഈ account-ന് Firestore users profile ഇല്ല."
      );

      await auth.signOut();

      return;
    }

    const userData = userSnap.data();

    const role = String(
      userData.role || ""
    ).trim().toLowerCase();


    if (role === "admin") {

      showMessage(
        "Login successful. Admin dashboard തുറക്കുന്നു...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 500);

      return;
    }


    if (role === "parent") {

      showMessage(
        "Login successful. Parent dashboard തുറക്കുന്നു...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "parent.html";
      }, 500);

      return;
    }


    showMessage(
      "ഈ account-ന് valid role ഇല്ല."
    );

    await auth.signOut();

  } catch (error) {

    console.error(error);

    let text = error.message || "Login failed.";

    if (error.code === "auth/invalid-credential") {
      text = "Email അല്ലെങ്കിൽ password തെറ്റാണ്.";
    }

    if (error.code === "auth/user-not-found") {
      text = "ഈ email ഉപയോഗിച്ച് account കണ്ടെത്തിയില്ല.";
    }

    if (error.code === "auth/wrong-password") {
      text = "Password തെറ്റാണ്.";
    }

    if (error.code === "auth/invalid-api-key") {
      text = "Firebase API configuration പരിശോധിക്കണം.";
    }

    showMessage(text);

  } finally {

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

  }

});

</script>


<!-- PWA Service Worker -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("PWA service worker registered");
        })
        .catch((error) => {
          console.error("PWA service worker error:", error);
        });
    });
  }
</script>

</body>
</html>
