<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFA HIFZ CLASS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .login-box {
      max-width: 420px;
      margin: 45px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    #debug {
      margin-top: 15px;
      padding: 10px;
      background: #f1f1f1;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-word;
      color: #444;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>SAFA HIFZ CLASS</h1>
    <p>Student & Parent Management System</p>
  </div>

  <div class="login-box">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">Login</button>

    <div id="message"></div>

    <div id="debug">
      Firebase starting...
    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCR-A17PO3zeiY2a1eH9cvsmv4Upxqe4",
      authDomain: "safa-hifz-class-7e84b.firebaseapp.com",
      projectId: "safa-hifz-class-7e84b",
      storageBucket: "safa-hifz-class-7e84b.firebasestorage.app",
      messagingSenderId: "476801753196",
      appId: "1:476801753196:web:b7f86a1f02eabec706f849",
      measurementId: "G-MR45L2B8PL"
    };


    const message = document.getElementById("message");
    const debug = document.getElementById("debug");
    const loginButton = document.getElementById("loginButton");


    try {

      debug.textContent = "Firebase initializing...";

      const app = initializeApp(firebaseConfig);

      const auth = getAuth(app);

      debug.textContent = "Firebase ready ✓";


      loginButton.addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        message.textContent = "";
        debug.textContent = "Login ശ്രമിക്കുന്നു...";


        if (!email || !password) {

          message.style.color = "red";
          message.textContent =
            "Email and password നൽകുക.";

          debug.textContent =
            "Email അല്ലെങ്കിൽ password missing.";

          return;
        }


        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";


        try {

          await setPersistence(
            auth,
            browserLocalPersistence
          );


          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          message.style.color = "green";
          message.textContent = "Login successful!";

          debug.textContent =
            "Logged in as: " +
            userCredential.user.email;


          setTimeout(() => {

            window.location.href = "dashboard.html";

          }, 800);


        } catch (error) {

          console.error(error);

          message.style.color = "red";
          message.textContent = "Login failed";


          debug.innerHTML =
            "<b>Firebase Error</b><br><br>" +
            "Code: " +
            (error.code || "unknown") +
            "<br><br>" +
            "Message: " +
            (error.message || "No message");


          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }

      });


    } catch (error) {

      console.error(error);

      message.style.color = "red";
      message.textContent =
        "Firebase load ചെയ്യാൻ കഴിഞ്ഞില്ല.";

      debug.innerHTML =
        "<b>Startup Error</b><br><br>" +
        "Code: " +
        (error.code || "unknown") +
        "<br><br>" +
        "Message: " +
        (error.message || "No message");
    }

  </script>

</body>
</html>
