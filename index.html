<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFA HIFZ CLASS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      color: #14532d;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #14532d;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #14532d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .firebase-status {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>SAFA HIFZ CLASS</h1>
    <div class="subtitle">Login to continue</div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="firebase-status" id="firebaseStatus">
      Connecting to Firebase...
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC6WpY_AThyG49yPS92rnPG9zy0PYDPVt0",
      authDomain: "safa-hifz-class-7e84b.firebaseapp.com",
      projectId: "safa-hifz-class-7e84b",
      storageBucket: "safa-hifz-class-7e84b.firebasestorage.app",
      messagingSenderId: "476801753196",
      appId: "1:476801753196:web:d4c8a8b0c1a4203606f849",
      measurementId: "G-ZTBTJCB5SR"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Elements
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const firebaseStatus = document.getElementById("firebaseStatus");


    // Firebase connection status
    firebaseStatus.textContent = "Firebase ready ✓";


    // Show message
    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }


    // Keep login session
    try {
      await setPersistence(auth, browserLocalPersistence);
    } catch (error) {
      console.error("Persistence error:", error);
    }


    // Login
    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Email and password enter ചെയ്യുക.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      message.className = "";
      message.textContent = "";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage(
          "Login successful ✓ Dashboard തുറക്കുന്നു...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      }

      catch (error) {

        console.error("Firebase Login Error:", error);

        let errorMessage = "Login failed.";

        switch (error.code) {

          case "auth/invalid-credential":
            errorMessage =
              "Email അല്ലെങ്കിൽ password തെറ്റാണ്.";
            break;

          case "auth/user-not-found":
            errorMessage =
              "ഈ email ഉപയോഗിച്ച് user കണ്ടെത്താനായില്ല.";
            break;

          case "auth/wrong-password":
            errorMessage =
              "Password തെറ്റാണ്.";
            break;

          case "auth/invalid-api-key":
            errorMessage =
              "Firebase API key പ്രശ്നമുണ്ട്. Firebase configuration പരിശോധിക്കുക.";
            break;

          case "auth/api-key-not-valid":
            errorMessage =
              "Firebase API key valid അല്ല. Firebase Console configuration പരിശോധിക്കുക.";
            break;

          case "auth/network-request-failed":
            errorMessage =
              "Internet connection പരിശോധിക്കുക.";
            break;

          case "auth/too-many-requests":
            errorMessage =
              "കൂടുതൽ login attempts. കുറച്ച് കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.";
            break;

          case "auth/operation-not-allowed":
            errorMessage =
              "Firebase Authentication-ൽ Email/Password enable ചെയ്തിട്ടില്ല.";
            break;

          default:
            errorMessage =
              "Code: " + error.code +
              "\nMessage: " + error.message;
        }

        showMessage(errorMessage, "error");

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });

  </script>

</body>
</html>
