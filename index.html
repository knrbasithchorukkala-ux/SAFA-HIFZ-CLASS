<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFA QURAN COLLEGE ONLINE PORTAL - Login</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f766e">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(3,43,36,0.82), rgba(3,43,36,0.88)),
        url("./IMG-20260921-WA0016.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1fr 420px;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    }

    .college-panel {
      min-height: 570px;
      position: relative;
      background:
        linear-gradient(rgba(3,43,36,0.48), rgba(3,43,36,0.72)),
        url("./IMG-20260921-WA0016.jpg") center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 42px;
      color: white;
    }

    .college-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(242,207,114,0.25);
      pointer-events: none;
    }

    .college-info {
      position: relative;
      z-index: 2;
    }

    .college-badge {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid rgba(242,207,114,0.7);
      border-radius: 30px;
      color: #f2cf72;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      background: rgba(3,43,36,0.55);
    }

    .college-panel h2 {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: .5px;
    }

    .college-panel p {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,.86);
    }

    .login-box {
      width: 100%;
      padding: 42px 34px;
      background: white;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #06483a, #0f766e);
      color: #f2cf72;
      border: 3px solid #d6a93a;
      font-size: 26px;
      font-weight: bold;
      box-shadow: 0 8px 22px rgba(6,72,58,.25);
      overflow: hidden;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      text-align: center;
      color: #06483a;
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 9px 0 30px;
      font-size: 14px;
    }

    .form-group {
      margin-top: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #164e43;
      font-size: 14px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d5ddd9;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      background: #fafcfb;
      color: #173b34;
      transition: .2s;
    }

    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15,118,110,.10);
      background: white;
    }

    #password {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #0f766e;
      font-size: 18px;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      background: transparent;
      color: #06483a;
    }

    button#loginBtn {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #06483a, #0f766e);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(6,72,58,.22);
      transition: .2s;
    }

    button#loginBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 11px 25px rgba(6,72,58,.28);
    }

    button#loginBtn:disabled {
      opacity: 0.6;
      transform: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 22px;
      color: #999;
      font-size: 11px;
    }

    .login-footer span {
      color: #b18421;
      font-weight: bold;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    @media (max-width: 800px) {
      .login-wrapper {
        max-width: 430px;
        grid-template-columns: 1fr;
      }

      .college-panel {
        min-height: 220px;
        padding: 28px;
        align-items: flex-end;
      }

      .college-panel h2 {
        font-size: 25px;
      }

      .college-panel p {
        font-size: 13px;
      }

      .login-box {
        padding: 32px 25px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-wrapper {
        border-radius: 20px;
      }

      .college-panel {
        min-height: 190px;
        padding: 23px;
      }

      .college-panel h2 {
        font-size: 22px;
      }

      .login-box {
        padding: 28px 20px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <div class="college-panel">
    <div class="college-info">
      <div class="college-badge">SAFA QURAN COLLEGE</div>
      <h2>SAFA QURAN COLLEGE<br>ONLINE PORTAL</h2>
      <p>
        Welcome to the official online portal for
        Usthad and Parent access.
      </p>
    </div>
  </div>

  <div class="login-box">

    <div class="logo-circle">
      <img src="./college logo.jpg" alt="SAFA QURAN COLLEGE Logo">
    </div>

    <h1>SAFA QURAN COLLEGE</h1>
    <div class="subtitle">Usthad / Parent Login</div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <div class="input-wrap">
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Show password"
          >👁️</button>
        </div>
      </div>

      <button type="submit" id="loginBtn">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="login-footer">
      <span>SAFA QURAN COLLEGE</span><br>
      Online Management Portal
    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC6WpY_AThyG49yPS92rnPG9zy0PYDPVt0",
  authDomain: "safa-hifz-class-7e84b.firebaseapp.com",
  projectId: "safa-hifz-class-7e84b",
  storageBucket: "safa-hifz-class-7e84b.firebasestorage.app",
  messagingSenderId: "476801753196",
  appId: "1:476801753196:web:d4a8a8b0c1a4203606f849",
  measurementId: "G-ZTBTJCB5SR"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


function showMessage(text, type = "error") {
  message.style.display = "block";
  message.className = type;
  message.textContent = text;
}


form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {

    await setPersistence(auth, browserLocalPersistence);

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const uid = result.user.uid;

    const userRef = doc(db, "users", uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {

      showMessage(
        "ഈ account-ന് Firestore users profile ഇല്ല."
      );

      await auth.signOut();

      return;
    }

    const userData = userSnap.data();

    const role = String(
      userData.role || ""
    ).trim().toLowerCase();


    if (role === "admin") {

      showMessage(
        "Login successful. Admin dashboard തുറക്കുന്നു...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 500);

      return;
    }


    if (role === "parent") {

      showMessage(
        "Login successful. Parent dashboard തുറക്കുന്നു...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "parent.html";
      }, 500);

      return;
    }


    showMessage(
      "ഈ account-ന് valid role ഇല്ല."
    );

    await auth.signOut();

  } catch (error) {

    console.error(error);

    let text = error.message || "Login failed.";

    if (error.code === "auth/invalid-credential") {
      text = "Email അല്ലെങ്കിൽ password തെറ്റാണ്.";
    }

    if (error.code === "auth/user-not-found") {
      text = "ഈ email ഉപയോഗിച്ച് account കണ്ടെത്തിയില്ല.";
    }

    if (error.code === "auth/wrong-password") {
      text = "Password തെറ്റാണ്.";
    }

    if (error.code === "auth/invalid-api-key") {
      text = "Firebase API configuration പരിശോധിക്കണം.";
    }

    showMessage(text);

  } finally {

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

  }

});


/* Password Show / Hide */
const passwordToggle = document.getElementById("passwordToggle");
const passwordInput = document.getElementById("password");

passwordToggle.addEventListener("click", () => {

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    passwordToggle.textContent = "🙈";
    passwordToggle.setAttribute("aria-label", "Hide password");
  } else {
    passwordInput.type = "password";
    passwordToggle.textContent = "👁️";
    passwordToggle.setAttribute("aria-label", "Show password");
  }

});

</script>


<!-- PWA Service Worker -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("PWA service worker registered");
        })
        .catch((error) => {
          console.error("PWA service worker error:", error);
        });
    });
  }
</script>

</body>
</html>
