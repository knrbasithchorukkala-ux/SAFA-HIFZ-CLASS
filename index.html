<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAFA HIFZ CLASS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .login-box {
      max-width: 420px;
      margin: 45px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #064e47;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .error-code {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>SAFA HIFZ CLASS</h1>
    <p>Student & Parent Management System</p>
  </div>

  <div class="login-box">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <div id="message"></div>

    <div id="errorCode" class="error-code"></div>

  </div>


  <script type="module">

    // Firebase App
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    // Firebase Authentication
    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    // Firebase Configuration
    const firebaseConfig = {

      apiKey:
        "AIzaSyCR-A17PO3zeiY2a1eH9cvsmv4Upxqe4",

      authDomain:
        "safa-hifz-class-7e84b.firebaseapp.com",

      projectId:
        "safa-hifz-class-7e84b",

      storageBucket:
        "safa-hifz-class-7e84b.firebasestorage.app",

      messagingSenderId:
        "476801753196",

      appId:
        "1:476801753196:web:b7f86a1f02eabec706f849",

      measurementId:
        "G-MR45L2B8PL"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Elements
    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const errorCode =
      document.getElementById("errorCode");


    // Login
    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      // Clear old messages
      message.textContent = "";
      errorCode.textContent = "";


      // Empty fields
      if (!email || !password) {

        message.style.color = "red";

        message.textContent =
          "Email and password നൽകുക.";

        return;
      }


      // Disable button
      loginButton.disabled = true;

      loginButton.textContent =
        "Logging in...";


      try {

        // Save login session
        await setPersistence(
          auth,
          browserLocalPersistence
        );


        // Firebase Login
        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        console.log(
          "Login successful:",
          userCredential.user
        );


        message.style.color = "green";

        message.textContent =
          "Login successful! Dashboard തുറക്കുന്നു...";


        // Open dashboard
        setTimeout(function () {

          window.location.replace(
            "dashboard.html"
          );

        }, 700);


      } catch (error) {

        console.error(
          "FIREBASE LOGIN ERROR:",
          error
        );


        message.style.color = "red";

        message.textContent =
          "Login failed. വീണ്ടും ശ്രമിക്കുക.";


        // SHOW EXACT FIREBASE ERROR
        errorCode.textContent =
          "Error code: " +
          (error.code || "unknown");


        // Enable button
        loginButton.disabled = false;

        loginButton.textContent =
          "Login";
      }

    }


    // Button click
    loginButton.addEventListener(
      "click",
      login
    );


    // Enter key login
    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


  </script>

</body>
</html>
