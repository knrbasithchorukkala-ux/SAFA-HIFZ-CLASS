<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFA HIFZ CLASS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .login-box {
      max-width: 420px;
      margin: 45px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #064e47;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d00;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>SAFA HIFZ CLASS</h1>
    <p>Student & Parent Management System</p>
  </div>

  <div class="login-box">
    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="message"></div>
  </div>

  <script type="module">

    import { initializeApp } 
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import { getAuth, signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCR-A17PO3zeiY2a1eH9cvxSmv4Upxqe-4",
      authDomain: "safa-hifz-class-7e84b.firebaseapp.com",
      projectId: "safa-hifz-class-7e84b",
      storageBucket: "safa-hifz-class-7e84b.firebasestorage.app",
      messagingSenderId: "476801753196",
      appId: "1:476801753196:web:b7f86a1f02eabec706f849",
      measurementId: "G-MR45L2B8PL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async function () {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Email and password നൽകുക.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.style.color = "green";
        message.textContent = "Login successful!";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {

        message.style.color = "red";
        message.textContent = "Login failed. Email അല്ലെങ്കിൽ password പരിശോധിക്കുക.";

        console.log(error);

      }
    };

  </script>

</body>
</html>
