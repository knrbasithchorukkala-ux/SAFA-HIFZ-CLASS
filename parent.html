<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SAFA HIFZ CLASS - Parent</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

header {
  background: #0f766e;
  color: white;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

header h2 {
  margin: 0;
  font-size: 20px;
}

.logout {
  background: #dc2626;
  border: 0;
  color: white;
  padding: 9px 13px;
  border-radius: 8px;
}

nav {
  background: white;
  padding: 10px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  border-bottom: 1px solid #ddd;
}

nav button {
  border: 0;
  padding: 10px 14px;
  border-radius: 8px;
  background: #e2e8f0;
  white-space: nowrap;
}

nav button.active {
  background: #0f766e;
  color: white;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 16px;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.item {
  border: 1px solid #e2e8f0;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  margin-bottom: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
}

textarea {
  min-height: 100px;
}

.send {
  background: #0f766e;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
}

.delete {
  background: #dc2626;
  color: white;
  border: 0;
  padding: 8px 12px;
  border-radius: 7px;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #dcfce7;
  color: #166534;
}

.small {
  color: #64748b;
  font-size: 13px;
}

</style>

</head>


<body>


<header>

<h2>SAFA HIFZ CLASS</h2>

<button
  class="logout"
  id="logoutBtn">
  Logout
</button>

</header>


<nav>

<button data-section="home"
        class="active">
Home
</button>

<button data-section="attendance">
Attendance
</button>

<button data-section="study">
Study
</button>

<button data-section="results">
Results
</button>

<button data-section="notices">
Notices
</button>

<button data-section="leave">
Leave
</button>

<button data-section="messages">
Messages
</button>

</nav>


<main>


<!-- HOME -->

<section id="home"
         class="section active">

<div class="card">

<h2>Parent Dashboard</h2>

<div id="studentInfo">
Loading...
</div>

</div>

</section>


<!-- ATTENDANCE -->

<section id="attendance"
         class="section">

<div class="card">

<h2>Attendance</h2>

<div id="attendanceList">
Loading...
</div>

</div>

</section>


<!-- STUDY -->

<section id="study"
         class="section">

<div class="card">

<h2>Study Progress</h2>

<div id="studyList">
Loading...
</div>

</div>

</section>


<!-- RESULTS -->

<section id="results"
         class="section">

<div class="card">

<h2>Results</h2>

<div id="resultList">
Loading...
</div>

</div>

</section>


<!-- NOTICES -->

<section id="notices"
         class="section">

<div class="card">

<h2>Notices</h2>

<div id="noticeList">
Loading...
</div>

</div>

</section>


<!-- LEAVE -->

<section id="leave"
         class="section">

<div class="card">

<h2>Apply Leave</h2>

<label>Leave Date</label>

<input
  type="date"
  id="leaveDate">

<label>Reason</label>

<textarea
  id="leaveReason"
  placeholder="Leave reason">
</textarea>

<button
  class="send"
  id="sendLeave">
  Send Leave Request
</button>

</div>


<div class="card">

<h2>My Leave Requests</h2>

<div id="leaveList">
Loading...
</div>

</div>

</section>


<!-- MESSAGES -->

<section id="messages"
         class="section">

<div class="card">

<h2>Send Message to Usthad</h2>

<textarea
  id="messageText"
  placeholder="Write your message">
</textarea>

<button
  class="send"
  id="sendMessage">
  Send Message
</button>

</div>


<div class="card">

<h2>My Messages</h2>

<div id="messageList">
Loading...
</div>

</div>

</section>


</main>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  getDoc,
  query,
  where,
  orderBy,
  serverTimestamp,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC6WpY_AThyG49yPS92rnPG9zy0PYDPVt0",

  authDomain:
    "safa-hifz-class-7e84b.firebaseapp.com",

  projectId:
    "safa-hifz-class-7e84b",

  storageBucket:
    "safa-hifz-class-7e84b.firebasestorage.app",

  messagingSenderId:
    "476801753196",

  appId:
    "1:476801753196:web:d4c8a8b0c1a4203606f849",

  measurementId:
    "G-ZTBTJCB5SR"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


let currentUser = null;
let studentNumber = "";
let studentData = null;


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatDate(timestamp) {

  if (!timestamp) return "";

  try {
    return timestamp.toDate().toLocaleString();
  } catch {
    return "";
  }

}


/* AUTH */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser = user;


    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(userRef);


      if (!userSnap.exists()) {

        alert(
          "Parent profile not found."
        );

        await signOut(auth);

        return;

      }


      const parentData =
        userSnap.data();


      const role =
        String(
          parentData.role || ""
        )
        .trim()
        .toLowerCase();


      if (role !== "parent") {

        alert(
          "Parent access only."
        );

        await signOut(auth);

        return;

      }


      /*
        IMPORTANT:
        studentNumber is always converted
        to String here.
      */

      studentNumber =
        String(
          parentData.studentNumber ?? ""
        ).trim();


      if (!studentNumber) {

        document.body.innerHTML = `

          <div style="
            padding:30px;
            font-family:Arial;
            text-align:center;
          ">

            <h2>Student link missing</h2>

            <p>
              Firebase users document-ൽ
              studentNumber ഇല്ല.
            </p>

            <p>
              Parent UID:
              ${escapeHtml(user.uid)}
            </p>

          </div>

        `;

        return;

      }


      await loadAll();


    } catch (error) {

      console.error(error);

      alert(error.message);

    }

  }
);


/* NAV */

document
  .querySelectorAll("nav button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll("nav button")
          .forEach(
            b =>
              b.classList.remove("active")
          );


        button.classList.add("active");


        document
          .querySelectorAll(".section")
          .forEach(
            section =>
              section.classList.remove("active")
          );


        document
          .getElementById(
            button.dataset.section
          )
          .classList.add("active");

      }
    );

  });


/* LOGOUT */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await signOut(auth);

      window.location.href =
        "index.html";

    }
  );


/* LOAD ALL */

async function loadAll() {

  await loadStudent();

  await loadAttendance();

  await loadStudy();

  await loadResults();

  await loadNotices();

  await loadLeaves();

  await loadMessages();

}


/* STUDENT */

async function loadStudent() {

  const box =
    document.getElementById(
      "studentInfo"
    );


  const q =
    query(
      collection(db, "students"),
      where(
        "studentNumber",
        "==",
        String(studentNumber)
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML = `

      <p>
        Student record കണ്ടെത്തിയില്ല.
      </p>

      <p>
        Student Number:
        <b>${escapeHtml(studentNumber)}</b>
      </p>

    `;

    return;

  }


  const first =
    snap.docs[0];


  studentData =
    first.data();


  box.innerHTML = `

    <div class="item">

      <h2>
        ${escapeHtml(studentData.name)}
      </h2>

      <p>
        Student Number:
        <b>${escapeHtml(studentNumber)}</b>
      </p>

      <p>
        Class:
        ${escapeHtml(studentData.className)}
      </p>

    </div>

  `;

}


/* ATTENDANCE */

async function loadAttendance() {

  const box =
    document.getElementById(
      "attendanceList"
    );


  const q =
    query(
      collection(db, "attendance"),
      where(
        "studentNumber",
        "==",
        String(studentNumber)
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML =
      "<p>No attendance records.</p>";

    return;

  }


  box.innerHTML = "";


  snap.forEach(item => {

    const d =
      item.data();


    box.innerHTML += `

      <div class="item">

        <b>
          ${escapeHtml(d.date)}
        </b>

        <br><br>

        Status:
        <span class="badge">
          ${escapeHtml(d.status)}
        </span>

      </div>

    `;

  });

}


/* STUDY */

async function loadStudy() {

  const box =
    document.getElementById(
      "studyList"
    );


  const q =
    query(
      collection(db, "studyProgress"),
      where(
        "studentNumber",
        "==",
        String(studentNumber)
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML =
      "<p>No study records.</p>";

    return;

  }


  box.innerHTML = "";


  snap.forEach(item => {

    const d =
      item.data();


    box.innerHTML += `

      <div class="item">

        <b>
          ${escapeHtml(d.date)}
        </b>

        <br>

        Surah:
        ${escapeHtml(d.surah)}

        <br>

        New Lesson:
        ${escapeHtml(d.newLesson)}

        <br>

        Revision:
        ${escapeHtml(d.revision)}

        <br>

        Performance:
        ${escapeHtml(d.performance)}

        <br>

        Note:
        ${escapeHtml(d.note)}

      </div>

    `;

  });

}


/* RESULTS */

async function loadResults() {

  const box =
    document.getElementById(
      "resultList"
    );


  const q =
    query(
      collection(db, "results"),
      where(
        "studentNumber",
        "==",
        String(studentNumber)
      ),
      where(
        "status",
        "==",
        "published"
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML =
      "<p>No published results.</p>";

    return;

  }


  box.innerHTML = "";


  snap.forEach(item => {

    const d =
      item.data();


    box.innerHTML += `

      <div class="item">

        <h3>
          ${escapeHtml(d.title)}
        </h3>

        <p>
          Mark:
          <b>${escapeHtml(d.mark)}</b>
        </p>

      </div>

    `;

  });

}


/* NOTICES */

async function loadNotices() {

  const box =
    document.getElementById(
      "noticeList"
    );


  const q =
    query(
      collection(db, "notices"),
      where(
        "status",
        "==",
        "published"
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML =
      "<p>No notices.</p>";

    return;

  }


  box.innerHTML = "";


  snap.forEach(item => {

    const d =
      item.data();


    box.innerHTML += `

      <div class="item">

        <h3>
          ${escapeHtml(d.title)}
        </h3>

        <p>
          ${escapeHtml(d.text)}
        </p>

      </div>

    `;

  });

}


/* LEAVE */

async function loadLeaves() {

  const box =
    document.getElementById(
      "leaveList"
    );


  const q =
    query(
      collection(db, "leaveRequests"),
      where(
        "parentUid",
        "==",
        currentUser.uid
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML =
      "<p>No leave requests.</p>";

    return;

  }


  box.innerHTML = "";


  snap.forEach(item => {

    const d =
      item.data();


    box.innerHTML += `

      <div class="item">

        <b>
          ${escapeHtml(d.leaveDate)}
        </b>

        <br>

        Reason:
        ${escapeHtml(d.reason)}

        <br>

        Status:
        <b>
          ${escapeHtml(
            d.status || "pending"
          )}
        </b>

        <br>

        Usthad Reply:
        ${escapeHtml(
          d.reply || "No reply yet"
        )}

      </div>

    `;

  });

}


/* SEND LEAVE */

document
  .getElementById("sendLeave")
  .addEventListener(
    "click",
    async () => {

      const leaveDate =
        document.getElementById(
          "leaveDate"
        ).value;


      const reason =
        document.getElementById(
          "leaveReason"
        ).value.trim();


      if (!leaveDate || !reason) {

        alert(
          "Date and reason required."
        );

        return;

      }


      const email =
        currentUser.email || "";


      await addDoc(
        collection(
          db,
          "leaveRequests"
        ),
        {

          parentUid:
            currentUser.uid,

          parentEmail:
            email,

          studentNumber:
            String(studentNumber),

          leaveDate,

          reason,

          status:
            "pending",

          reply:
            "",

          createdAt:
            serverTimestamp()

        }
      );


      alert(
        "Leave request sent."
      );


      document.getElementById(
        "leaveDate"
      ).value = "";


      document.getElementById(
        "leaveReason"
      ).value = "";


      loadLeaves();

    }
  );


/* MESSAGES */

async function loadMessages() {

  const box =
    document.getElementById(
      "messageList"
    );


  const q =
    query(
      collection(db, "messages"),
      where(
        "parentUid",
        "==",
        currentUser.uid
      )
    );


  const snap =
    await getDocs(q);


  if (snap.empty) {

    box.innerHTML =
      "<p>No messages.</p>";

    return;

  }


  box.innerHTML = "";


  snap.forEach(item => {

    const d =
      item.data();


    box.innerHTML += `

      <div class="item">

        <b>Your message</b>

        <p>
          ${escapeHtml(d.text)}
        </p>

        <hr>

        <b>Usthad reply</b>

        <p>
          ${escapeHtml(
            d.reply || "No reply yet"
          )}
        </p>

        <button
          class="delete"
          onclick="deleteMessage('${item.id}')">
          Delete
        </button>

      </div>

    `;

  });

}


/* SEND MESSAGE */

document
  .getElementById("sendMessage")
  .addEventListener(
    "click",
    async () => {

      const text =
        document.getElementById(
          "messageText"
        ).value.trim();


      if (!text) {

        alert(
          "Message എഴുതുക."
        );

        return;

      }


      await addDoc(
        collection(
          db,
          "messages"
        ),
        {

          parentUid:
            currentUser.uid,

          parentEmail:
            currentUser.email || "",

          studentNumber:
            String(studentNumber),

          text,

          status:
            "unread",

          reply:
            "",

          createdAt:
            serverTimestamp()

        }
      );


      alert(
        "Message sent."
      );


      document.getElementById(
        "messageText"
      ).value = "";


      loadMessages();

    }
  );


/* DELETE MESSAGE */

window.deleteMessage =
  async function(id) {

    if (
      !confirm(
        "Delete this message?"
      )
    ) return;


    await deleteDoc(
      doc(
        db,
        "messages",
        id
      )
    );


    loadMessages();

  };

</script>

</body>

</html>
